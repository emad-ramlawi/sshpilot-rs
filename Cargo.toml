[package]
name = "sshpilot-rs"
version = "0.2.1"
edition = "2024"
rust-version = "1.88"
description = "Simple SSH connection manager: your ~/.ssh/config hosts in hand-sorted groups, with a terminal and SFTP file manager"
license = "GPL-3.0-or-later"
readme = "README.md"
repository = "https://github.com/emad-ramlawi/sshpilot-rs"
homepage = "https://github.com/emad-ramlawi/sshpilot-rs"
keywords = ["ssh", "sftp", "gtk", "terminal"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_5"] }
anyhow = "1.0.104"
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_12"] }
russh-sftp = "3.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "process", "io-util", "fs", "time"] }
vte4 = "0.10.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
