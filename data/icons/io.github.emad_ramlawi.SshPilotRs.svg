<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2ec4b6"/>
      <stop offset="1" stop-color="#1b6f9f"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16222e"/>
      <stop offset="1" stop-color="#0d151d"/>
    </linearGradient>
  </defs>
  <!-- tile -->
  <rect x="8" y="12" width="112" height="108" rx="24" fill="#124d6e"/>
  <rect x="8" y="8" width="112" height="108" rx="24" fill="url(#bg)"/>
  <!-- terminal window -->
  <rect x="22" y="26" width="84" height="64" rx="10" fill="url(#screen)"/>
  <circle cx="33" cy="35" r="3" fill="#ff6b6b"/>
  <circle cx="43" cy="35" r="3" fill="#ffd166"/>
  <circle cx="53" cy="35" r="3" fill="#06d6a0"/>
  <!-- prompt: chevron + cursor -->
  <path d="M34 52 l14 10 l-14 10" fill="none" stroke="#7df9e8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="56" y="68" width="24" height="7" rx="3.5" fill="#7df9e8"/>
  <!-- group stack: three ordered rows, the manual sort -->
  <rect x="70" y="84" width="40" height="8" rx="4" fill="#ffffff" opacity="0.95"/>
  <rect x="70" y="95" width="40" height="8" rx="4" fill="#ffd166"/>
  <rect x="70" y="106" width="40" height="8" rx="4" fill="#ffffff" opacity="0.95"/>
  <path d="M60 92 v18 m-5 -5 l5 5 l5 -5" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
